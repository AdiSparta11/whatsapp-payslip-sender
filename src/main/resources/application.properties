# ===========================================
# WhatsApp Payslip Sender — Configuration
# ===========================================

# Server (reads PORT env var provided by platforms like Render, defaults to 8080)
server.port=${PORT:8080}

# File upload limits (50MB should be plenty for Excel files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf (disable cache for dev)
spring.thymeleaf.cache=false

# ===========================================
# Meta WhatsApp Cloud API Credentials
# ===========================================
# Get these from: https://developers.facebook.com → Your App → WhatsApp → API Setup
#
# Phone Number ID: the numeric ID shown next to your test phone number
# Access Token: the temporary token (or permanent system user token)

whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:REPLACE_WITH_YOUR_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:REPLACE_WITH_YOUR_ACCESS_TOKEN}
whatsapp.api-version=v21.0
